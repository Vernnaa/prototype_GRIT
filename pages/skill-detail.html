<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Skill Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="skill-detail">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ SKILL DETAIL ============ -->
            <div class="screen active" id="skill-detail">
              <div class="sub-header">
                <div class="back-btn" onclick="go('skill-progress')">‹</div>
                <div class="sub-title" id="skill-detail-name">Data Analysis</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div class="card">
                  <div style="display: flex; gap: 18px">
                    <div style="flex: 1; text-align: center">
                      <div class="small-muted">Current</div>
                      <div
                        id="skill-detail-current"
                        style="
                          font-size: 22px;
                          font-weight: 800;
                          color: var(--purple);
                        "
                      >
                        56%
                      </div>
                    </div>
                    <div style="flex: 1; text-align: center">
                      <div class="small-muted">Required</div>
                      <div id="skill-detail-required" style="font-size: 22px; font-weight: 800">80%</div>
                    </div>
                    <div style="flex: 1; text-align: center">
                      <div class="small-muted">Gap</div>
                      <div
                        id="skill-detail-gap"
                        style="font-size: 22px; font-weight: 800; color: #c0475c"
                      >
                        24%
                      </div>
                    </div>
                  </div>
                  <div class="progress-track" style="margin-top: 14px">
                    <div class="progress-fill" id="skill-detail-progress" style="width: 56%"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="eyebrow" style="margin-bottom: 10px; color: #4c8b2b">
                    What you can do
                  </div>
                  <div class="muted" id="skill-detail-capability">
                    • Basic data cleaning<br />• Basic spreadsheet analysis
                  </div>
                </div>
                <div class="card">
                  <div class="eyebrow" style="margin-bottom: 10px; color: #8a2a4e">
                    What you need to improve
                  </div>
                  <div class="muted" id="skill-detail-improvement">
                    • Campaign performance analysis<br />• Data interpretation<br />•
                    Business recommendations
                  </div>
                </div>
                <div class="card m-card" onclick="go('learning')">
                  <div class="row">
                    <div>
                      <div class="eyebrow" style="margin-bottom: 6px">
                        Recommended
                      </div>
                      <div style="font-weight: 700; font-size: 14.5px">
                        10-minute lesson
                      </div>
                    </div>
                    <div style="font-size: 18px">→</div>
                  </div>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="go('learning')">
                  Improve this skill
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
