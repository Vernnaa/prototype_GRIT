<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Career Goal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="career-goal">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ CAREER GOAL ============ -->
            <div class="screen active" id="career-goal">
              <div class="app-header">
                <div class="brand" onclick="go('home')">
                  <div class="mark">G</div>
                  <div class="word">GRIT</div>
                </div>
                <div class="header-actions">
                  <div class="icon-btn" onclick="go('notif')">
                    <span class="dot"></span><svg width="17" height="17" viewBox="0 0 24 24" stroke="var(--navy)" fill="none" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
                  </div>
                  <div class="avatar" onclick="go('profile')">A</div>
                </div>
              </div>
              <div class="scroll">
                <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 16px">
                  Career Goal
                </h1>
                <div class="card">
                  <div class="row">
                    <span class="eyebrow">My target job</span
                    ><span style="font-size: 16px; color: var(--text-3)">›</span>
                  </div>
                  <div
                    style="font-size: 19px; font-weight: 800; margin: 6px 0 12px"
                  >
                    <span id="career-goal-name">Marketing Staff</span>
                  </div>
                  <div class="chip" style="display: inline-flex" onclick="go('career-select', { changeJob: 'true' })">Change goal</div>
                </div>
                <div class="card">
                  <div class="section-title">Career path</div>
                  <div
                    style="
                      display: flex;
                      flex-direction: column;
                      align-items: flex-start;
                      gap: 0;
                    "
                  >
                    <div
                      style="
                        font-weight: 800;
                        font-size: 14px;
                        padding: 10px 16px;
                        border-radius: 12px;
                        background: var(--navy);
                        color: var(--lime);
                      "
                    >
                      <span id="career-path-start">Marketing Staff</span>
                    </div>
                    <div
                      style="
                        color: var(--text-3);
                        font-size: 16px;
                        margin: 4px 0 4px 22px;
                      "
                    >
                      ↓
                    </div>
                    <div
                      id="career-path-middle"
                      style="
                        font-weight: 600;
                        font-size: 13.5px;
                        padding: 9px 16px;
                        border-radius: 12px;
                        background: var(--bg);
                        color: var(--text-2);
                      "
                    >
                      Marketing Specialist
                    </div>
                    <div
                      style="
                        color: var(--text-3);
                        font-size: 16px;
                        margin: 4px 0 4px 22px;
                      "
                    >
                      ↓
                    </div>
                    <div
                      id="career-path-end"
                      style="
                        font-weight: 600;
                        font-size: 13.5px;
                        padding: 9px 16px;
                        border-radius: 12px;
                        background: var(--bg);
                        color: var(--text-2);
                      "
                    >
                      Marketing Manager
                    </div>
                  </div>
                </div>
                <div class="card">
                  <div class="section-title">Job requirements</div>
                  <div id="career-skills"></div>
                </div>
                <button
                  class="btn btn-primary"
                  style="margin-top: 4px"
                  onclick="go('skill-progress')"
                >
                  Improve my skill gap
                </button>
              </div>
              <div class="bottom-nav" id="bottom-nav2"></div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
