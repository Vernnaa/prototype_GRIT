<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Practice Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="practice-result">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ PRACTICE RESULT ============ -->
            <div class="screen active" id="practice-result">
              <div class="sub-header">
                <div class="back-btn" onclick="go('practice')">‹</div>
                <div class="sub-title">Practice Result</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div class="card" style="text-align: center">
                  <div class="eyebrow" style="margin-bottom: 12px">
                    Overall score
                  </div>
                  <div class="ring-wrap">
                    <div
                      class="ring-bg"
                      style="
                        background: conic-gradient(
                          var(--lime) 280.8deg,
                          var(--track) 0
                        );
                      "
                    ></div>
                    <div class="ring-hole"><b id="practice-score">78%</b><span id="practice-score-label">Great work!</span></div>
                  </div>
                </div>
                <div class="card">
                  <div class="eyebrow" style="margin-bottom: 10px">
                    Skill performance
                  </div>
                  <div id="result-skills"></div>
                </div>
                <div class="card">
                  <div class="eyebrow" style="margin-bottom: 8px">AI feedback</div>
                  <div
                    style="font-weight: 700; font-size: 13px; margin-bottom: 4px"
                  >
                    What you did well
                  </div>
                  <p class="muted" style="margin-bottom: 12px">
                    You identified key trends and provided actionable insights.
                  </p>
                  <div
                    style="font-weight: 700; font-size: 13px; margin-bottom: 4px"
                  >
                    What to improve
                  </div>
                  <p class="muted">
                    Try to support your recommendations with more data.
                  </p>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="go('practice')">
                  View detailed feedback
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
