<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — More</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="more">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ MORE ============ -->
            <div class="screen active" id="more">
              <div class="app-header">
                <div class="brand" onclick="go('home')">
                  <div class="mark">G</div>
                  <div class="word">GRIT</div>
                </div>
                <div class="header-actions">
                  <div class="avatar" onclick="go('profile')">A</div>
                </div>
              </div>
              <div class="scroll">
                <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 14px">
                  More
                </h1>
                <div class="card" style="padding: 6px 18px">
                  <div id="more-list"></div>
                </div>
                <div
                  class="card m-card"
                  style="
                    margin-top: 14px;
                    background: linear-gradient(135deg, #f3eeff, #effae0);
                    border: none;
                  "
                  onclick="go('grit-pro')"
                >
                  <div class="row">
                    <span class="eyebrow" style="color: var(--purple)"
                      >GRIT Pro</span
                    ><span style="font-size: 16px">›</span>
                  </div>
                  <div style="font-weight: 700; font-size: 14.5px; margin-top: 6px">
                    Unlock full learning paths &amp; unlimited missions
                  </div>
                </div>
              </div>
              <div class="bottom-nav" id="bottom-nav5"></div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
