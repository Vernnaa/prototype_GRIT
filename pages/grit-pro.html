<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — GRIT Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="grit-pro">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ GRIT PRO ============ -->
            <div class="screen active" id="grit-pro">
              <div class="sub-header">
                <div class="back-btn" onclick="go('more')">‹</div>
                <div class="sub-title">GRIT Pro</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <h1 style="font-size: 21px; font-weight: 800; margin-bottom: 14px">
                  Upgrade your career journey
                </h1>
                <div class="toggle-row" style="margin-bottom: 18px">
                  <div class="toggle-opt active">Monthly</div>
                  <div class="toggle-opt">Yearly (save 20%)</div>
                </div>
                <div style="display: flex; gap: 10px">
                  <div class="plan-card">
                    <div style="font-weight: 700; font-size: 14px">GRIT Free</div>
                    <div
                      style="font-size: 20px; font-weight: 800; margin: 8px 0 10px"
                    >
                      Rp0<span
                        style="
                          font-size: 11px;
                          font-weight: 600;
                          color: var(--text-3);
                        "
                        >/month</span
                      >
                    </div>
                    <div class="plan-feature">○ Basic assessment</div>
                    <div class="plan-feature">○ Basic learning</div>
                    <div class="plan-feature">○ Gamification</div>
                    <div class="plan-feature">○ Limited missions</div>
                  </div>
                  <div class="plan-card pro">
                    <div
                      style="
                        font-weight: 700;
                        font-size: 14px;
                        color: var(--purple);
                      "
                    >
                      GRIT Pro
                    </div>
                    <div
                      style="font-size: 20px; font-weight: 800; margin: 8px 0 10px"
                    >
                      Rp49.000<span
                        style="
                          font-size: 11px;
                          font-weight: 600;
                          color: var(--text-3);
                        "
                        >/month</span
                      >
                    </div>
                    <div class="plan-feature">✓ Full learning paths</div>
                    <div class="plan-feature">✓ AI Career Coach</div>
                    <div class="plan-feature">✓ Advanced assessment</div>
                    <div class="plan-feature">✓ Unlimited missions</div>
                    <div class="plan-feature">✓ Advanced analytics</div>
                  </div>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="go('payment')">
                  Upgrade to GRIT Pro
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
