<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="portfolio">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ PORTFOLIO ============ -->
            <div class="screen active" id="portfolio">
              <div class="sub-header">
                <div class="back-btn" onclick="go('more')">‹</div>
                <div class="sub-title">Portfolio</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 14px;
                    margin-bottom: 16px;
                  "
                >
                  <div
                    class="avatar"
                    style="
                      width: 56px;
                      height: 56px;
                      border-radius: 16px;
                      font-size: 20px;
                    "
                  >
                    A
                  </div>
                  <div>
                    <div id="portfolio-name" style="font-weight: 800; font-size: 17px">Angela</div>
                    <div class="small-muted" id="portfolio-career">
                      Marketing Enthusiast · Target: Marketing Staff
                    </div>
                  </div>
                </div>
                <div class="card" style="margin-bottom: 16px">
                  <div class="row">
                    <span class="muted">Job readiness</span
                    ><span id="portfolio-readiness" style="font-weight: 800">78%</span>
                  </div>
                  <div class="progress-track" style="margin-top: 8px">
                    <div class="progress-fill" style="width: 78%"></div>
                  </div>
                </div>
                <div class="tab-row" style="gap: 16px">
                  <div class="tab-item active">Overview</div>
                  <div class="tab-item">Projects</div>
                  <div class="tab-item">Skills</div>
                  <div class="tab-item">Certificates</div>
                  <div class="tab-item">Achievements</div>
                </div>
                <div class="section-title">Projects</div>
                <div id="portfolio-projects"></div>
                <button class="btn btn-primary" style="margin-top: 6px">
                  Share portfolio
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
