<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Practice Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="practice-info">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ PRACTICE DETAIL ============ -->
            <div class="screen active" id="practice-info">
              <div class="sub-header">
                <div class="back-btn" onclick="go('practice')">‹</div>
                <div class="sub-title">Practice Detail</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <span class="tag" id="pi-role">Marketing</span>
                <h1
                  style="font-size: 21px; font-weight: 800; margin: 10px 0 8px"
                  id="pi-title"
                >
                  Analyze Campaign Performance
                </h1>
                <p class="muted" id="pi-desc" style="margin-bottom: 16px">
                  You are asked to evaluate the performance of a digital campaign
                  and provide recommendations.
                </p>
                <div class="card">
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <circle cx="12" cy="12" r="9" />
                          <path d="M12 7v5l3 3" />
                        </svg>
                      </div>
                      <div>
                        <div style="font-weight: 600; font-size: 13.5px">
                          Estimated time
                        </div>
                        <div class="small-muted" id="pi-time">15 minutes</div>
                      </div>
                    </div>
                  </div>
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <path d="M4 20V10M12 20V4M20 20v-7" />
                        </svg>
                      </div>
                      <div>
                        <div style="font-weight: 600; font-size: 13.5px">
                          Skills tested
                        </div>
                        <div class="small-muted" id="pi-skills">
                          Data Analysis, Excel, Business Reasoning
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <path d="M9 11l3 3L22 4" />
                          <path
                            d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"
                          />
                        </svg>
                      </div>
                      <div>
                        <div style="font-weight: 600; font-size: 13.5px">
                          Expected output
                        </div>
                        <div class="small-muted" id="pi-output">
                          Insights &amp; 3 recommendations
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="go('practice-detail')">
                  Start practice
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
