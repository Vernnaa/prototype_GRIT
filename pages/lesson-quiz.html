<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Lesson Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="lesson-quiz">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033"/></svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5"/><rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033"/><rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5"/></svg>
          </span>
        </div>
        <div class="screen active" id="lesson-quiz">
          <div class="sub-header"><div class="back-btn" onclick="go('lesson')">‹</div><div class="sub-title">Lesson Quiz</div></div>
          <div class="scroll">
            <p class="muted page-intro">Check your understanding before starting a real-world mission.</p>
            <form id="lesson-quiz-form" class="assessment-form">
              <fieldset class="card question-card"><legend>1 of 3</legend><p>Which metric measures visits that become customers?</p><label><input type="radio" name="q1" value="0" required /> Reach</label><label><input type="radio" name="q1" value="1" /> Conversion rate</label><label><input type="radio" name="q1" value="0" /> Impressions</label></fieldset>
              <fieldset class="card question-card"><legend>2 of 3</legend><p>Clicks are high but conversions are low. What should you inspect?</p><label><input type="radio" name="q2" value="1" required /> Offer and landing experience</label><label><input type="radio" name="q2" value="0" /> Brand color only</label><label><input type="radio" name="q2" value="0" /> Number of followers</label></fieldset>
              <fieldset class="card question-card"><legend>3 of 3</legend><p>A strong recommendation should include:</p><label><input type="radio" name="q3" value="0" required /> An opinion only</label><label><input type="radio" name="q3" value="1" /> Evidence, implication, and action</label><label><input type="radio" name="q3" value="0" /> More raw data</label></fieldset>
              <button class="btn btn-primary" type="submit">Submit quiz</button>
            </form>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
    </main>
    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
