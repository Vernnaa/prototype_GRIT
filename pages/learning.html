<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Learning Path</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="learning">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ LEARNING PATH ============ -->
            <div class="screen active" id="learning">
              <div class="sub-header">
                <div class="back-btn" onclick="go('home')">‹</div>
                <div class="sub-title">Learning Path</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div class="eyebrow" style="margin-bottom: 4px">
                  Your next skill gap
                </div>
                <h1 id="learning-skill-name" style="font-size: 19px; font-weight: 800; margin-bottom: 14px">
                  Data Analysis
                </h1>
                <div class="card">
                  <div style="display: flex; gap: 24px">
                    <div>
                      <div class="small-muted">Current level</div>
                      <div
                        style="
                          font-size: 20px;
                          font-weight: 800;
                          color: var(--purple);
                        "
                      >
                        56%
                      </div>
                    </div>
                    <div>
                      <div class="small-muted">Required level</div>
                      <div style="font-size: 20px; font-weight: 800">80%</div>
                    </div>
                  </div>
                </div>
                <div class="section-title" style="margin-top: 18px">
                  Recommended lesson
                </div>
                <div
                  class="card m-card"
                  onclick="go('lesson')"
                  style="display: flex; align-items: center; gap: 12px"
                >
                  <div
                    class="li-icon"
                    style="background: var(--lime); width: 44px; height: 44px"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      stroke="var(--navy)"
                      fill="none"
                      stroke-width="1.8"
                    >
                      <path
                        d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"
                      />
                    </svg>
                  </div>
                  <div style="flex: 1">
                    <div id="learning-lesson-title" style="font-weight: 700; font-size: 14px">
                      Understand Campaign Performance
                    </div>
                    <div class="small-muted">10 min</div>
                  </div>
                  <span style="font-size: 16px">›</span>
                </div>
                <div class="section-title" style="margin-top: 18px">
                  Your learning loop
                </div>
                <div class="card">
                  <div id="loop-list"></div>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="go('lesson')">
                  Start lesson
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
