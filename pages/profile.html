<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="profile">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ PROFILE ============ -->
            <div class="screen active" id="profile">
              <div class="sub-header">
                <div class="back-btn" onclick="go('home')">‹</div>
                <div class="sub-title">Profile</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 14px;
                    margin-bottom: 16px;
                  "
                >
                  <div
                    class="avatar"
                    style="
                      width: 56px;
                      height: 56px;
                      border-radius: 16px;
                      font-size: 20px;
                    "
                  >
                    A
                  </div>
                  <div>
                    <div id="profile-name" style="font-weight: 800; font-size: 17px">Angela</div>
                    <div class="small-muted" id="profile-career">
                      Marketing Enthusiast · Target: Marketing Staff
                    </div>
                  </div>
                </div>
                <div class="card">
                  <div class="row">
                    <span class="muted">Job readiness</span
                    ><span id="profile-readiness" style="font-weight: 800">78%</span>
                  </div>
                  <div class="progress-track" style="margin-top: 8px">
                    <div class="progress-fill" style="width: 78%"></div>
                  </div>
                </div>
                <div class="card" style="display: flex">
                  <div style="flex: 1; text-align: center">
                    <div style="font-weight: 800; font-size: 16px">12</div>
                    <div class="small-muted">Skills</div>
                  </div>
                  <div style="flex: 1; text-align: center">
                    <div style="font-weight: 800; font-size: 16px">5</div>
                    <div class="small-muted">Projects</div>
                  </div>
                  <div style="flex: 1; text-align: center">
                    <div style="font-weight: 800; font-size: 16px">4</div>
                    <div class="small-muted">Certificates</div>
                  </div>
                  <div style="flex: 1; text-align: center">
                    <div style="font-weight: 800; font-size: 16px">18</div>
                    <div class="small-muted">Achievements</div>
                  </div>
                </div>
                <div class="card" style="padding: 6px 18px">
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <path d="M22 10L12 4 2 10l10 6 10-6z" />
                          <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5" />
                        </svg>
                      </div>
                      <span style="font-weight: 600; font-size: 13.5px"
                        >Education</span
                      >
                    </div>
                    <span style="color: var(--text-3)">›</span>
                  </div>
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <path
                            d="M3 7h18v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"
                          />
                        </svg>
                      </div>
                      <span style="font-weight: 600; font-size: 13.5px"
                        >Experience</span
                      >
                    </div>
                    <span style="color: var(--text-3)">›</span>
                  </div>
                  <div class="list-item">
                    <div class="li-left">
                      <div class="li-icon">
                        <svg viewBox="0 0 24 24">
                          <path
                            d="M12 2v4M12 18v4M2 12h4M18 12h4M12 8a4 4 0 100 8 4 4 0 000-8z"
                          />
                        </svg>
                      </div>
                      <span style="font-weight: 600; font-size: 13.5px"
                        >Career interests</span
                      >
                    </div>
                    <span style="color: var(--text-3)">›</span>
                  </div>
                </div>
                <button class="btn btn-primary" style="margin-top: 14px">
                  Share portfolio
                </button>
                <button class="btn btn-ghost" style="margin-top: 10px" onclick="go('onboarding')">
                  Edit profile
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
