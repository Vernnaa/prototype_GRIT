<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Achievements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="achievements">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ ACHIEVEMENTS ============ -->
            <div class="screen active" id="achievements">
              <div class="sub-header">
                <div class="back-btn" onclick="go('more')">‹</div>
                <div class="sub-title">Achievements</div>
              </div>
              <div class="scroll" style="padding-top: 6px">
                <div
                  class="card"
                  style="display: flex; align-items: center; gap: 16px"
                >
                  <div
                    style="
                      width: 64px;
                      height: 64px;
                      border-radius: 50%;
                      background: var(--navy);
                      color: var(--lime);
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      font-family: 'Plus Jakarta Sans';
                    "
                  >
                    <span style="font-size: 9px; font-weight: 600">LEVEL</span
                    ><span style="font-size: 19px; font-weight: 800; line-height: 1"
                      >12</span
                    >
                  </div>
                  <div>
                    <div style="font-weight: 800; font-size: 15px">
                      Career Explorer
                    </div>
                    <div class="small-muted" id="achievement-xp">2,450 XP / 3,000 XP</div>
                    <div
                      class="progress-track"
                      style="width: 150px; margin-top: 6px"
                    >
                      <div class="progress-fill" style="width: 81%"></div>
                    </div>
                  </div>
                </div>
                <div class="tab-row" style="margin-top: 16px">
                  <div class="tab-item active">Badges</div>
                  <div class="tab-item">Streak</div>
                  <div class="tab-item">Stats</div>
                </div>
                <div
                  style="display: flex; flex-direction: column; gap: 10px"
                  id="badge-list"
                ></div>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
