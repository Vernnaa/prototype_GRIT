<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Log In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-page="login">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033"/></svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5"/><rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033"/><rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5"/></svg>
          </span>
        </div>
        <div class="screen active" id="login">
          <div class="sub-header"><div class="back-btn" onclick="go('splash')">‹</div><div class="sub-title">Log In</div></div>
          <div class="scroll form-scroll">
            <h1 class="page-heading">Welcome back</h1>
            <p class="muted page-intro">Enter anything below to open the prototype dashboard.</p>
            <form class="card form-card" id="login-form">
              <label class="field"><span>Email</span><input name="email" type="text" inputmode="email" placeholder="Type anything" required /></label>
              <label class="field"><span>Password</span><input name="password" type="password" placeholder="Type anything" required /></label>
              <button class="btn btn-primary" type="submit">Log in</button>
            </form>
            <p class="prototype-note">Prototype mode: no login details are checked or saved.</p>
          </div>
        </div>
        <div class="home-indicator"></div>
      </div>
    </main>
    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
