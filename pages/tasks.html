<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body data-page="tasks">
    <main class="device" aria-label="GRIT mobile prototype">

          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />

          </span>
        </div>

        <!-- ============ MISSIONS ============ -->
            <div class="screen active" id="tasks">
              <div class="app-header">
                <div class="brand" onclick="go('home')">
                  <div class="mark">G</div>
                  <div class="word">GRIT</div>
                </div>
                <div class="header-actions">
                  <div class="avatar" onclick="go('profile')">A</div>
                </div>
              </div>
              <div class="scroll" style="padding-bottom: 110px">
                <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 10px">
                  Tasks &amp; Missions
                </h1>
                <div class="tab-row" id="mission-tabs"></div>
                <div id="mission-list"></div>
              </div>
              <div class="bottom-nav" id="bottom-nav4"></div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/router.js"></script>
