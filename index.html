<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GRIT — Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="splash" data-root="true">
    <main class="device" aria-label="GRIT mobile prototype">
      <div class="screen-frame">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="6" width="3" height="5" rx="0.5" fill="#1F2033" />
              <rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="#1F2033" />
              <rect x="9" y="2" width="3" height="9" rx="0.5" fill="#1F2033" />
              <rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="#1F2033" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#1F2033" opacity=".5" />
              <rect x="2" y="2" width="14" height="7" rx="1.3" fill="#1F2033" />
              <rect x="22.3" y="3.3" width="1.4" height="4.4" rx="0.7" fill="#1F2033" opacity=".5" />
            </svg>
          </span>
        </div>

        <!-- ============ SPLASH / ONBOARDING ============ -->
            <div class="screen active" id="splash">
              <div
                class="scroll"
                style="
                  justify-content: center;
                  display: flex;
                  flex-direction: column;
                  padding-top: 0;
                  align-items: center;
                "
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    margin-bottom: 2px;
                  "
                >
                  <svg width="30" height="30" viewBox="0 0 30 30">
                    <rect width="30" height="30" rx="9" fill="#1F2033" />
                    <path
                      d="M9 15a6 6 0 1 1 6 6"
                      stroke="#B7F34A"
                      stroke-width="2.4"
                      fill="none"
                      stroke-linecap="round"
                    />
                  </svg>
                  <span
                    style="
                      font-family: 'Plus Jakarta Sans';
                      font-weight: 800;
                      font-size: 24px;
                      letter-spacing: 0.5px;
                    "
                    >GRIT</span
                  >
                </div>
                <div
                  class="small-muted"
                  style="
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    font-weight: 700;
                    font-size: 10px;
                    margin-bottom: 26px;
                  "
                >
                  From job goal to job capability
                </div>
                <div id="mascot-big" style="margin-bottom: 26px"></div>
                <h1
                  style="
                    font-size: 22px;
                    font-weight: 800;
                    text-align: center;
                    line-height: 1.3;
                    padding: 0 24px;
                  "
                >
                  Turn your career goal into real capability
                </h1>
                <p
                  class="muted"
                  style="text-align: center; padding: 0 30px; margin-top: 10px"
                >
                  Learn, practice, and prove you're ready for the job you want.
                </p>
                <div class="dot-nav">
                  <span class="on"></span><span></span><span></span><span></span>
                </div>
              </div>
              <div style="padding: 0 20px 34px">
                <button class="btn btn-primary" onclick="enterApp()">
                  Get Started
                </button>
                <button class="btn btn-ghost" style="margin-top: 10px" onclick="go('login')">
                  Log In
                </button>
              </div>
            </div>
        <div class="home-indicator"></div>
      </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
